<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Словарь IT-жаргона</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="{{ url_for('index') }}" class="logo">📘 IT-Slang Dictionary</a>
            <div>
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('admin') }}" style="margin-right: 10px; color: #333; text-decoration: none;">Админка</a>
                    <a href="{{ url_for('logout') }}" style="color: #dc3545; text-decoration: none;">Выйти</a>
                {% else %}
                    <a href="{{ url_for('login') }}" style="color: #0d6efd; text-decoration: none;">Вход для модератора</a>
                {% endif %}
            </div>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
