{% extends "base.html" %}
{% block content %}
    <h2>Панель управления</h2>
    <div class="card">
        <h3>Добавить термин</h3>
        <form method="post" action="{{ url_for('create_term') }}">
            <input type="text" name="term_name" placeholder="Термин" required style="margin-bottom: 5px;">
            <input type="text" name="definition" placeholder="Определение" required style="margin-bottom: 5px;">
            <button type="submit" class="btn btn-primary">Создать</button>
        </form>
    </div>

    <h3>Список терминов</h3>
    <table>
        <thead><tr><th>ID</th><th>Термин</th><th>Происхождение</th><th>Действия</th></tr></thead>
        <tbody>
            {% for term in terms %}
            <tr>
                <td>{{ term.id }}</td>
                <td>{{ term.term_name }}</td>
                <td>{{ term.origin }}</td>
                <td>
                    <a href="{{ url_for('term_detail', term_id=term.id) }}" class="btn" style="font-size: 0.8rem; padding: 4px 8px; background: #e9ecef;">Смотреть</a>
                    <a href="{{ url_for('delete_term', term_id=term.id) }}" class="btn btn-danger" onclick="return confirm('Удалить?')">X</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
