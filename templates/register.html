{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card auth-card">
    <h1 class="term-title">Регистрация пользователя</h1>
    <p class="form-hint">После регистрации вы сможете предложить новый термин. Публикация появится на сайте только после проверки администратором.</p>
    <form method="post">
        <label>Логин *
            <input type="text" name="username" minlength="3" required>
        </label>
        <label>Пароль *
            <input type="password" name="password" minlength="6" required>
        </label>
        <label>Повторите пароль *
            <input type="password" name="password_repeat" minlength="6" required>
        </label>
        <button type="submit" class="btn">Создать аккаунт</button>
        <a href="{{ url_for('login') }}" class="btn btn-ghost">Уже есть аккаунт</a>
    </form>
</div>
{% endblock %}
